<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <h1 class="text-3xl font-bold mb-8">Admin Panel</h1>

  <!-- Admin Registration Form -->
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md mb-8">
    <h2 class="text-xl font-semibold mb-4">Register Admin</h2>
    <form id="registerAdminForm" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">Name</label>
        <input type="text" name="name" required class="w-full border border-gray-300 rounded px-3 py-2"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" name="email" required class="w-full border border-gray-300 rounded px-3 py-2"/>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Register</button>
    </form>
    <p id="registerAdminMessage" class="mt-2 text-sm"></p>
  </div>

  <!-- Auto-generate Slots Form -->
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-xl font-semibold mb-4">Auto-generate Slots</h2>
    <form id="generateSlotsForm" class="space-y-4">
      <div>
        <label class="block mb-1 font-medium">Admin ID</label>
        <input type="number" name="admin_id" required class="w-full border border-gray-300 rounded px-3 py-2"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Date</label>
        <input type="date" name="date" required class="w-full border border-gray-300 rounded px-3 py-2"/>
      </div>
      <div>
        <label class="block mb-1 font-medium">Slot Duration (minutes)</label>
        <input type="number" name="slotDuration" placeholder="Default 45" class="w-full border border-gray-300 rounded px-3 py-2"/>
      </div>

      <!-- Dynamic Breaks Section -->
      <div>
        <label class="block mb-1 font-medium">Breaks (optional)</label>
        <div id="breaksContainer" class="space-y-2 mb-2"></div>
        <button type="button" id="addBreakBtn" class="bg-gray-200 px-2 py-1 rounded hover:bg-gray-300">Add Break</button>
      </div>

      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Generate Slots</button>
    </form>
    <p id="generateSlotsMessage" class="mt-2 text-sm"></p>
  </div>

  <script>
    const API_BASE = "http://localhost:8080/Admin";

    // --- Register Admin ---
    const registerAdminForm = document.getElementById("registerAdminForm");
    const registerAdminMessage = document.getElementById("registerAdminMessage");

    registerAdminForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(registerAdminForm);
      const data = Object.fromEntries(formData.entries());

      try {
        const res = await fetch(`${API_BASE}/registeradmin`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await res.json();
        registerAdminMessage.textContent = result.message || "Success";
        registerAdminMessage.className = result.status ? "text-green-600 mt-2" : "text-red-600 mt-2";
      } catch (error) {
        registerAdminMessage.textContent = error.message;
        registerAdminMessage.className = "text-red-600 mt-2";
      }
    });

    // --- Auto-generate Slots ---
    const generateSlotsForm = document.getElementById("generateSlotsForm");
    const generateSlotsMessage = document.getElementById("generateSlotsMessage");
    const breaksContainer = document.getElementById("breaksContainer");
    const addBreakBtn = document.getElementById("addBreakBtn");

    // Convert "HH:mm" -> "h:mmam/pm" (matches Joi validation)
    function formatTimeToAmPm(time) {
      if (!time) return "";
      let [h, m] = time.split(":").map(Number);
      const period = h >= 12 ? "pm" : "am";
      h = h % 12 || 12;
      return `${h}:${m.toString().padStart(2, "0")}${period}`;
    }

    // Create a new break row
    function createBreakRow() {
      const div = document.createElement("div");
      div.className = "flex gap-2 items-center";

      const startInput = document.createElement("input");
      startInput.type = "time";
      startInput.required = true;
      startInput.className = "border border-gray-300 rounded px-2 py-1 flex-1";

      const endInput = document.createElement("input");
      endInput.type = "time";
      endInput.required = true;
      endInput.className = "border border-gray-300 rounded px-2 py-1 flex-1";

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.textContent = "Remove";
      removeBtn.className = "bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600";
      removeBtn.addEventListener("click", () => div.remove());

      div.appendChild(startInput);
      div.appendChild(endInput);
      div.appendChild(removeBtn);
      breaksContainer.appendChild(div);
    }

    addBreakBtn.addEventListener("click", createBreakRow);

    generateSlotsForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(generateSlotsForm);
      const data = Object.fromEntries(formData.entries());

      if (!data.admin_id || !data.date) {
        generateSlotsMessage.textContent = "Admin ID and Date are required";
        generateSlotsMessage.className = "text-red-600 mt-2";
        return;
      }

      data.date = new Date(data.date).toISOString().split("T")[0];
      data.slotDuration = data.slotDuration ? parseInt(data.slotDuration, 10) : 45;

      // Collect breaks in Joi-compatible format: "h:mmam/pm"
      const breaks = [];
      breaksContainer.querySelectorAll("div").forEach((row) => {
        const start = row.querySelectorAll('input[type="time"]')[0].value;
        const end = row.querySelectorAll('input[type="time"]')[1].value;
        if (start && end) {
          breaks.push({ start: formatTimeToAmPm(start), end: formatTimeToAmPm(end) });
        }
      });
      data.breaks = breaks;

      try {
        const res = await fetch(`${API_BASE}/auto-generate-slots`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        const result = await res.json();
        generateSlotsMessage.textContent = result.message || (result.status ? "Slots generated successfully" : "Validation failed");
        generateSlotsMessage.className = result.status ? "text-green-600 mt-2" : "text-red-600 mt-2";
      } catch (error) {
        generateSlotsMessage.textContent = error.message;
        generateSlotsMessage.className = "text-red-600 mt-2";
      }
    });
  </script>
</body>
</html>
